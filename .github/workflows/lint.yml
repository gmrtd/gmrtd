name: Lint

# go vet and gofmt are enforced (blocking) - both are clean as of this workflow's
# introduction.
#
# staticcheck and govulncheck are informational only for now (continue-on-error):
#  - staticcheck currently reports ~50 pre-existing findings (mostly deprecated
#    crypto/elliptic / ecdsa.PublicKey.X/Y usage newly flagged after the Go 1.26
#    bump, plus a handful of style nits), spread across many unrelated files -
#    fixing that is a separate cleanup pass, not something every future PR
#    should be blocked on.
#  - govulncheck findings so far have all been in the Go standard library
#    (e.g. GO-2026-5972 in encoding/asn1, reachable from chip data via
#    cms.Validity.Parse) and are fixed by raising the `go` directive in go.mod,
#    which every workflow uses as its toolchain version (see #554).
# Revisit making these blocking once the above are addressed.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install libpcsclite-dev
        run: |
          sudo apt-get update
          sudo apt-get -y install libpcsclite-dev

      - name: go vet
        run: make vet

      - name: gofmt
        run: make fmt

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: staticcheck (informational - see workflow header)
        continue-on-error: true
        run: staticcheck ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install libpcsclite-dev
        run: |
          sudo apt-get update
          sudo apt-get -y install libpcsclite-dev

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: govulncheck (informational - see workflow header)
        continue-on-error: true
        run: govulncheck ./...
