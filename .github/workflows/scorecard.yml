name: Scorecard

# OpenSSF Scorecard supply-chain security analysis. publish_results makes the
# score public (api.scorecard.dev, scorecard.dev viewer, README badge), and the
# SARIF is uploaded to the repo's Code scanning tab. branch_protection_rule
# re-scores when branch protection changes, since that's a scored check.

on:
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1' # weekly, Monday 4:30am UTC
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # OIDC token required by publish_results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
