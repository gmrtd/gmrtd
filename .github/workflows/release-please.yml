name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build-ios:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned for OpenSSF Scorecard; keep in step with golang.org/x/mobile in go.mod.
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260811152309-903fc839b21d
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260811152309-903fc839b21d
      - name: gomobile init
        run: gomobile init
      - name: Build iOS XCFramework
        run: make ios
      - name: Zip XCFramework
        run: cd dist/ios && zip -qr Gmrtd.xcframework.zip Gmrtd.xcframework
      - name: Save iOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcframework
          path: dist/ios/Gmrtd.xcframework.zip

  build-android:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned for OpenSSF Scorecard; keep in step with golang.org/x/mobile in go.mod.
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260811152309-903fc839b21d
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260811152309-903fc839b21d
      - name: gomobile init
        run: gomobile init
      - name: Build Android AARs
        run: |
          ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" \
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" \
          make android
      - name: Save Android artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-aars
          path: |
            dist/android/gmrtd.aar
            dist/android/gmrtd-android-16kb.aar

  upload-assets:
    needs: [release, build-ios, build-android]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download iOS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-xcframework
          path: dist/ios
      - name: Download Android artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-aars
          path: dist/android
      - name: Generate checksums
        run: cd dist && sha256sum ios/Gmrtd.xcframework.zip android/gmrtd.aar android/gmrtd-android-16kb.aar > checksums.txt
      - name: Upload release assets
        run: |
          gh release upload ${{ needs.release.outputs.tag_name }} \
            dist/ios/Gmrtd.xcframework.zip \
            dist/android/gmrtd.aar \
            dist/android/gmrtd-android-16kb.aar \
            dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify gmrtd-ios
        if: github.repository == 'gmrtd/gmrtd'
        env:
          GH_TOKEN: ${{ secrets.GMRTD_IOS_DISPATCH_TOKEN }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          gh api repos/gmrtd/gmrtd-ios/dispatches \
            -f event_type=gmrtd-release \
            -f "client_payload[version]=${TAG#v}"
