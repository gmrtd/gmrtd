name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results

jobs:
  Build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install libpcsclite-dev
      run: |
        sudo apt-get update
        sudo apt-get -y install libpcsclite-dev
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Build
      run: go build -v ./...
    - name: Test Coverage
      # -coverpkg=./..., not the bare default: Go's default coverage only
      # credits a package for lines exercised by its OWN _test.go files, not
      # lines exercised indirectly through another package's tests (e.g.
      # verifier/passiveauth/bac exercised via higher-level integration-style
      # tests) - which was under-reporting real coverage to SonarCloud.
      run: go test -race -coverpkg=./... ./... -coverprofile=coverage.out
    - name: Archive code coverage results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage.out
        path: coverage.out
    - name: Test Result
      run: go test -race ./... -json > report.json
    - name: Archive test report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: report.json
        path: report.json

  Analysis:
    needs: Build
    name: Analysis
    runs-on: ubuntu-latest
    # Fork PRs get no secrets, so without SONAR_TOKEN the scan can only fail. Skip it;
    # the code is still analysed on the push to main once merged.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download coverage results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage.out
      - name: Download test report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report.json
      - name: Analyze with SonarCloud
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Generate a token on Sonarcloud.io, add it to the secrets of this repo with the name SONAR_TOKEN (Settings > Secrets > Actions > add new repository secret)
        with:
          # Additional arguments for the sonarcloud scanner
          args:
            # Unique keys of your project and organization, sourced from repo variables
            # (Settings > Secrets and variables > Actions > Variables); values from SonarCloud > Information (bottom-left menu)
            # mandatory
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/vendor/**,**/*.md,**/*.ml,**/*.yml
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.test.exclusions=**/vendor/**
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.go.tests.reportPaths=report.json
            -Dsonar.issue.ignore.multicriteria=e1,e2
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
            -Dsonar.issue.ignore.multicriteria.e2.ruleKey=go:S107
            -Dsonar.issue.ignore.multicriteria.e2.resourceKey=**/fuzz_test.go
